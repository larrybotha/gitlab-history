<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MR History{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #1c2128;
      --border: #30363d;
      --border-light: #21262d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --link: #58a6ff;
      --link-hover: #79c0ff;
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.15);
      --purple: #bc8cff;
      --purple-bg: rgba(188, 140, 255, 0.15);
      --red: #f85149;
      --red-bg: rgba(248, 81, 73, 0.15);
      --orange: #d29922;
      --orange-bg: rgba(210, 153, 34, 0.15);
      --blue: #58a6ff;
      --blue-bg: rgba(56, 139, 253, 0.15);
      --yellow: #e3b341;
      --radius: 6px;
      --radius-lg: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Noto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo:hover { text-decoration: none; color: var(--text); }
    .header-logo svg { width: 24px; height: 24px; fill: var(--purple); }
    .header-nav { display: flex; gap: 8px; margin-left: auto; }
    .header-stat {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 10px;
      background: var(--bg-tertiary);
      border-radius: var(--radius);
    }
    .header-stat strong { color: var(--text); }

    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-merged { background: var(--purple-bg); color: var(--purple); }
    .badge-opened { background: var(--green-bg); color: var(--green); }
    .badge-closed { background: var(--red-bg); color: var(--red); }
    .badge-draft { background: var(--orange-bg); color: var(--orange); }
    .badge-label {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-size: 11px;
      padding: 1px 6px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); text-decoration: none; color: var(--text); }
    .btn-sm { padding: 3px 8px; font-size: 12px; }
    .btn-active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

    /* Forms */
    .input {
      padding: 5px 12px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15); }
    .input::placeholder { color: var(--text-muted); }
    select.input { cursor: pointer; }

    /* Markdown content */
    .md-content { color: var(--text); line-height: 1.7; word-break: break-word; }
    .md-content h1, .md-content h2, .md-content h3 { margin-top: 20px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .md-content h1 { font-size: 1.5em; }
    .md-content h2 { font-size: 1.25em; }
    .md-content h3 { font-size: 1.1em; border-bottom: none; }
    .md-content p { margin-bottom: 12px; }
    .md-content ul, .md-content ol { padding-left: 24px; margin-bottom: 12px; }
    .md-content li { margin-bottom: 4px; }
    .md-content code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .md-content pre { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; overflow-x: auto; margin-bottom: 12px; }
    .md-content pre code { background: none; padding: 0; }
    .md-content blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-secondary); margin-bottom: 12px; }
    .md-content table { border-collapse: collapse; margin-bottom: 12px; width: 100%; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .md-content th { background: var(--bg-tertiary); font-weight: 600; }
    .md-content a { color: var(--link); }
    .md-content img { max-width: 100%; border-radius: var(--radius); }

    /* Utility */
    .text-secondary { color: var(--text-secondary); }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 12px; }
    .text-xs { font-size: 11px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 16px; }
    .mt-4 { margin-top: 24px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 16px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .flex-wrap { flex-wrap: wrap; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo">

      MR History
    </a>
    {% block header_extra %}{% endblock %}
  </header>

  {% block content %}{% endblock %}
</body>
</html>
